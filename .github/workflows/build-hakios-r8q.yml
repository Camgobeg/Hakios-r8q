name: Build Hakios r8q (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xcode Command Line Tools
        run: |
          xcode-select --install || true
          echo "Waiting for XCode tools installation..."
          sleep 5

      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install theos (macOS)
        run: |
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          echo 'export PATH="$HOME/theos/bin:$PATH"' >>~/.zshrc
          export PATH="$HOME/theos/bin:$PATH"
          theos-install
          theos bootstrap

      - name: Install dependencies
        run: |
          brew install \
            git curl python3 \
            make clang lld flex bison gperf \
            perl \
            meson ninja-build \
            xz lz4 \
            7zip \
            device-tree-compiler \
            bc kmod

      - name: Fetch iOS (placeholder)
        run: |
          echo "============================================================="
          echo "iOS FETCH REQUIRED"
          echo "============================================================="
          echo "iOS 16 (or requested version) must be fetched from Apple:"
          echo "1. Download iOS IPSW from Apple's public servers:"
          echo "   - About 7.4 GB for iOS 16"
          echo "   - Unpack into sysimage/ directory"
          echo "2. Or run manually: sysimage/fetch.sh"
          echo "============================================================="

      - name: Copy phone firmware (placeholder)
        run: |
          echo "============================================================="
          echo "PHONE FIRMWARE COPY REQUIRED"
          echo "============================================================="
          echo "Firmware from your Samsung Galaxy S20 FE (r8q):"
          echo "1. Enable USB debugging + rooted debugging in LineageOS"
          echo "2. Connect phone to Mac via USB"
          echo "3. Run: devices/r8q/pull-firmware.sh"
          echo "4. Fills fw-gpu-r8q/, fw-audio-r8q/, fw-wifi-r8q/ etc."
          echo "============================================================="

      - name: Build Hakios loader
        run: |
          make loaders
        working-directory: /workspace
        env:
          PATH: "/opt/theos/bin:${PATH}"

      - name: Build Hakios kernel
        run: |
          make -C kernel all
        working-directory: /workspace

      - name: Run Hakios
        run: |
          make phone
        working-directory: /workspace
        env:
          PATH: "/opt/theos/bin:${PATH}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-r8q-macos-${{ github.run_number }}
          path: |
            devices/r8q/
            sysimage/
            loader
            kernel
            fw-*
          retention-days: 30
