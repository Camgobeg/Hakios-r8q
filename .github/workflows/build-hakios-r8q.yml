name: Build Hakios r8q (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Xcode CLT
        run: |
          xcode-select --install 2>&1 || true
          echo "Xcode CLT status checked"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install theos
        run: |
          cd ~
          if [ -d "theos" ]; then
            echo "theos exists, updating..."
            cd theos && git pull --depth 1
          else
            echo "Cloning theos..."
            git clone --depth 1 https://github.com/theos/theos.git theos
          fi
          export PATH="$HOME/theos/bin:$PATH"
          echo "theos location: $HOME/theos"
          ls -la "$HOME/theos/bin/" 2>/dev/null || echo "checking theos contents"
          if [ -f "$HOME/theos/bin/theos" ]; then
            echo "✅ theos binary found"
            theos --version 2>&1 || true
          else
            echo "⚠️ theos binary not in $HOME/theos/bin/"
            ls -la "$HOME/theos/" 2>/dev/null
            find "$HOME/theos/" -name "theos" -type f 2>/dev/null | head -5
          fi

      - name: Install build dependencies
        run: |
          brew update > /dev/null 2>&1
          PACKAGES="git curl python3 make clang lld flex bison gperf perl meson ninja-build xz lz4 7zip device-tree-compiler bc kmod pkg-config"
          brew install --overwrite --quiet $PACKAGES 2>&1 | tail -10
          echo "Dependencies ready"

      - name: Verify theos environment
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          THEOS_STATUS="not_found"
          if [ -f "$HOME/theos/bin/theos" ]; then
            THEOS_STATUS="found"
            theos --version 2>&1 || true
          elif [ -f "$HOME/theos/theos" ]; then
            THEOS_STATUS="found_alternative"
            "$HOME/theos/theos" --version 2>&1 || true
          else
            echo "theos not found in standard locations"
            find "$HOME/theos/" -maxdepth 2 -type f -name "*.sh" 2>/dev/null | head -5
          fi
          echo "theos_status=$THEOS_STATUS" >> $GITHUB_ENV

      - name: Check workspace state (CORRECT PATHS)
        run: |
          echo "=== Checking runner workspace ==="
          pwd
          ls -la . 2>/dev/null | head -20
          echo ""
          echo "Checking for devices folder:"
          ls -la devices/ 2>/dev/null || echo "No devices/ folder here"
          echo ""
          echo "Checking for workspace-relative paths:"
          ls -la /workspace/ 2>/dev/null || echo "/workspace not at root"
          echo ""
          echo "Listing repo root contents:"
          ls -la | head -30

      - name: Build Hakios loaders (CORRECT PATH)
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          cd "$(dirname "$0")" 2>/dev/null || cd .
          echo "Working directory: $(pwd)"
          echo "Building Hakios loaders..."
          make loaders 2>&1 | tail -30
          LOADERS_EXIT=$?
          echo "loaders_exit=$LOADERS_EXIT" >> $GITHUB_ENV

      - name: Build Hakios kernel
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          cd "$(dirname "$0")" 2>/dev/null || cd .
          echo "Working directory: $(pwd)"
          echo "Building Hakios kernel..."
          make -C kernel all 2>&1 | tail -30
          KERNEL_EXIT=$?
          echo "kernel_exit=$KERNEL_EXIT" >> $GITHUB_ENV

      - name: Run Hakios phone session
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          cd "$(dirname "$0")" 2>/dev/null || cd .
          echo "Working directory: $(pwd)"
          echo "Running Hakios phone session..."
          make phone 2>&1 | tail -30
          PHONE_EXIT=$?
          echo "phone_exit=$PHONE_EXIT" >> $GITHUB_ENV

      - name: Upload artifacts (CORRECT PATHS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-r8q-${{ github.run_number }}
          path: |
            ./devices/r8q/ 2>/dev/null
            ./sysimage/ 2>/dev/null
            ./loader 2>/dev/null
            ./kernel 2>/dev/null
            ./fw-*/ 2>/dev/null
          retention-days: 30

      - name: Build completion summary
        if: always()
        run: |
          echo "============================================================="
          echo "HAKIOS R8Q BUILD #${GITHUB_RUN_NUMBER}"
          echo "============================================================="
          echo "Repository: Camgobeg/Hakios-r8q"
          echo "Runner: macOS-latest"
          echo "Duration: ${{ job.duration }} min"
          echo "Status: ${GITHUB_STATUS:-completed}"
          echo ""
          echo "Build components:"
          echo "  loaders:  exit code $LOADERS_EXIT"
          echo "  kernel:   exit code $KERNEL_EXIT"
          echo "  phone:    exit code $PHONE_EXIT"
          echo ""
          echo "Artifacts: hakios-r8q-${GITHUB_RUN_NUMBER}"
          echo "If successful, examine artifacts and run locally:"
          echo "  make loader && make phone"
          echo "============================================================="
