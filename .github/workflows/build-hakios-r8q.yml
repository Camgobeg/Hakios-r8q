name: Build Hakios r8q (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: /bin/bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Xcode CLT
        run: |
          xcode-select --install 2>&1 || true
          echo "Xcode CLT status checked"

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install theos
        run: |
          cd ~
          if [ -d "theos" ]; then
            echo "theos exists, updating..."
            cd theos && git pull --depth 1
          else
            echo "Cloning theos..."
            git clone --depth 1 https://github.com/theos/theos.git theos
          fi
          export PATH="$HOME/theos/bin:$PATH"
          if [ -f "$HOME/theos/bin/theos" ]; then
            echo "theos installed: $HOME/theos/bin/theos"
            theos --version
          else
            echo "theos binary not in expected location"
          fi

      - name: Install build dependencies
        run: |
          brew update > /dev/null 2>&1
          PACKAGES="git curl python3 make clang lld flex bison gperf perl meson ninja-build xz lz4 7zip device-tree-compiler bc kmod pkg-config"
          brew install --overwrite --quiet $PACKAGES 2>&1 | tail -5
          echo "Dependencies ready"

      - name: Verify theos environment
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          if [ -f "$HOME/theos/bin/theos" ]; then
            echo "theos binary found"
            theos --version
          else
            echo "theos will be configured during build steps"
          fi

      - name: Check workspace state
        run: |
          echo "Workspace state:"
          ls -la /workspace/devices/r8q/ 2>/dev/null || echo "No devices/r8q"
          ls -la /workspace/sysimage/ 2>/dev/null || echo "No sysimage"
          ls -la /workspace/loader 2>/dev/null || echo "No loader"
          ls -la /workspace/kernel 2>/dev/null || echo "No kernel"

      - name: Build Hakios loaders
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          cd /workspace
          echo "Building Hakios loaders..."
          make loaders 2>&1 | tail -20

      - name: Build Hakios kernel
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          cd /workspace
          echo "Building Hakios kernel..."
          make -C kernel all 2>&1 | tail -20

      - name: Run Hakios phone session
        run: |
          export PATH="$HOME/theos/bin:$PATH"
          cd /workspace
          echo "Running Hakios phone session..."
          make phone 2>&1 | tail -20

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-r8q-${{ github.run_number }}
          path: |
            /workspace/devices/r8q/
            /workspace/sysimage/ 2>/dev/null
            /workspace/loader 2>/dev/null
            /workspace/kernel 2>/dev/null
          retention-days: 30

      - name: Build completion summary
        if: always()
        run: |
          echo "Hakios r8q Build #${GITHUB_RUN_NUMBER}"
          echo "Repository: Camgobeg/Hakios-r8q"
          echo "Runner: macOS-latest"
          echo "Status: ${GITHUB_STATUS:-completed}"
          echo "Artifacts: hakios-r8q-${GITHUB_RUN_NUMBER}"
          echo "If successful, run locally: make loader && make phone"