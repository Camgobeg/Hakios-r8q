name: Build Hakios r8q (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xcode Command Line Tools
        run: |
          xcode-select --install 2>/dev/null || true

      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install theos (manual macOS setup)
        run: |
          git clone --depth 1 https://github.com/theos/theos.git ~/theos
          echo 'export PATH="$HOME/theos/bin:$PATH"' >>~/.zshrc
          export PATH="$HOME/theos/bin:$PATH"
          # Verify theos installed
          if [ -f ~/theos/bin/theos ]; then
            echo "✅ theos installed successfully"
          else
            echo "⚠️ theos may need manual setup"
          fi

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install --overwrite --quiet \
            git curl python3 \
            make clang lld flex bison gperf \
            perl \
            meson ninja-build \
            xz lz4 \
            7zip \
            device-tree-compiler \
            bc kmod \
            pkg-config

      - name: Set up theos environment
        run: |
          echo "export PATH=\"$HOME/theos/bin:\$PATH\"" >>/tmp/theos-path.sh
          chmod +x /tmp/theos-path.sh
          source /tmp/theos-path.sh
          theos bootstrap

      - name: Fetch iOS (placeholder - manual step)
        run: |
          echo "iOS 16 must be fetched from Apple (~7.4 GB)"
          echo "Run: sysimage/fetch.sh manually"

      - name: Copy phone firmware (placeholder)
        run: |
          echo "Firmware from Galaxy S20 FE (r8q):"
          echo "1. Enable USB debugging + rooted debugging in LineageOS"
          echo "2. Connect phone to Mac via USB"
          echo "3. Run: devices/r8q/pull-firmware.sh"

      - name: Build Hakios loader
        run: |
          source /tmp/theos-path.sh
          make loaders
        working-directory: /workspace
        env:
          PATH: "/opt/theos/bin:${PATH}"

      - name: Build Hakios kernel
        run: |
          make -C kernel all
        working-directory: /workspace
        env:
          PATH: "/opt/theos/bin:${PATH}"

      - name: Run Hakios phone session
        run: |
          make phone
        working-directory: /workspace
        env:
          PATH: "/opt/theos/bin:${PATH}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-r8q-macos-${{ github.run_number }}
          path: |
            devices/r8q/
            sysimage/
            loader
            kernel
            fw-*
            theos/**
          retention-days: 30
